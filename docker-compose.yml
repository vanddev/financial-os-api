services:

  postgres:
    image: postgres:16-alpine
    container_name: financial-os-postgres
    environment:
      - POSTGRES_DB=financial_os
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-os-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  financial-os-network:
    driver: bridge

volumes:
  postgres_data:
