  postgres:
    image: postgres:16-alpine
    container_name: financial-os-postgres
    environment:
      - POSTGRES_DB=financial_os
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-os-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial-os-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@financial-os.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - financial-os-network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  financial-os-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
